
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <section class="cartao">

            <div class="avatar"></div>

            <h1>Ana Silva</h1>

            <p class="descricao">
                Designer e criadora de interfaces
            </p>

            <div class="botoes">
                <button class="seguir">Seguir</button>
                <button class="mensagem">Mensagem</button>
            </div>

            <div class="estatisticas">

                <div class="numero">
                    <strong>1.2k</strong>
                    <span>seguidores</span>
                </div>

                <div class="numero">
                    <strong>340</strong>
                    <span>a seguir</span>
                </div>

                <div class="numero">
                    <strong>87</strong>
                    <span>publicações</span>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
