<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dascoisas</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif, sans-serif;
            background-color: #dfdbdb;
        }
        
        .edy{
            width: 50%;
            padding: 10px;
            border: 2px solid #c5c5b5;
            box-sizing: border-box;
            
        }
        textarea {
            width: 95%;
            height: 150px;
            padding: 10px;
            border: 2px solid #c5c5b5;
            box-sizing: border-box;
            resize: none;
        }
        
        
        
    </style>
</head>
<body>
    <h1> <a href="05.html">Proximo exercicio</a></h1>
    <form>
        Por favor, preencha o formulário abaixo com suas informações pessoais:<br>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome" class="edy">
        <label>Sexo</label>
        <input type="radio" id="masculino" name="sexo" value="masculino"><label for="masculino">M</label>
        <input type="radio" id="feminino" name="sexo" value="feminino"><label for="feminino">F</label><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Digite seu email" class="edy"><br>
        <p></p>
        <label for="Navegador_favorito">Navegador Favorito:</label>
        <select id="Navegador_favorito" name="Navegador_favorito">
            <option value="chrome">Chrome</option>
            <option value="firefox">Firefox</option>
            <option value="safari">Safari</option>
            <option value="edge">Edge</option>
        </select><br>
        <p></p>
        <label for="esportes_que_aprecio">Esportes que aprecio</label>
        <input type="checkbox" id="futebol" name="esportes_que_aprecio" value="futebol"><label for="futebol">Futebol</label>
        <input type="checkbox" id="basquete" name="esportes_que_aprecio" value="basquete"><label for="basquete">Basquete</label>
        <input type="checkbox" id="tenis" name="esportes_que_aprecio" value="tenis"><label for="tenis">Tênis</label>
        <input type="checkbox" id="volei" name="esportes_que_aprecio" value="volei"><label for="volei">Vôlei</label>
        <input type="checkbox" id="handebol" name="esportes_que_aprecio" value="handebol"><label for="handebol">Handebol</label>
        <input type="checkbox" id="nenhum" name="esportes_que_aprecio" value="nenhum"><label for="nenhum">Nenhum</label><br>
        <p></p>
        <label for="mensagem">Deixa uma mensagem:sobre o teu esporte favorito:</label><br>
        <textarea name="mensagem" placeholder="Digite sua mensagem" required></textarea><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        
    </form>
    
</body>
</html>
